<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TTBJ 総合力スコア計算</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #dbe2ea;
      --accent: #6f1d7a;
      --accent-soft: #f4e9f6;
      --danger: #b42318;
      --shadow: 0 12px 32px rgba(31, 41, 55, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .wrap {
      width: min(760px, calc(100% - 32px));
      margin: 40px auto;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: clamp(1.55rem, 4vw, 2.2rem);
      letter-spacing: .02em;
    }

    .header p {
      margin: 0;
      color: var(--muted);
      font-size: .96rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: clamp(20px, 4vw, 32px);
    }

    .grid {
      display: grid;
      gap: 18px;
    }

    .field label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 7px;
      font-weight: 700;
    }

    .field label span:last-child {
      color: var(--muted);
      font-weight: 500;
      font-size: .9rem;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      background: #fff;
      overflow: hidden;
      transition: border-color .15s, box-shadow .15s;
    }

    .input-wrap:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    input[type="number"] {
      width: 100%;
      border: 0;
      outline: 0;
      padding: 15px 14px;
      font-size: 1.15rem;
      color: var(--text);
      background: transparent;
      appearance: textfield;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .suffix {
      padding: 0 14px;
      color: var(--muted);
      white-space: nowrap;
      font-weight: 600;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      margin-top: 22px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      color: white;
      background: var(--accent);
    }

    .secondary {
      color: var(--text);
      background: #eef1f5;
    }

    .error {
      display: none;
      margin: 14px 0 0;
      color: var(--danger);
      font-weight: 600;
      font-size: .94rem;
    }

    .result {
      display: none;
      margin-top: 26px;
      padding-top: 26px;
      border-top: 1px solid var(--line);
    }

    .score-main {
      text-align: center;
      background: var(--accent-soft);
      border-radius: 16px;
      padding: 22px 18px;
    }

    .score-main .caption {
      color: var(--muted);
      font-size: .92rem;
      font-weight: 700;
      letter-spacing: .03em;
    }

    .score-main .value {
      margin: 2px 0 0;
      color: var(--accent);
      font-size: clamp(3rem, 12vw, 5rem);
      font-weight: 800;
      line-height: 1.05;
    }

    .score-main .outof {
      color: var(--muted);
      font-weight: 600;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 14px;
    }

    .detail {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      text-align: center;
    }

    .detail .k {
      color: var(--muted);
      font-size: .8rem;
      margin-bottom: 2px;
    }

    .detail .v {
      font-size: 1.2rem;
      font-weight: 800;
    }

    .note {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #f8fafc;
      color: var(--muted);
      font-size: .88rem;
    }

    .formula {
      margin-top: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #4b5563;
      overflow-wrap: anywhere;
    }

    .footer {
      margin-top: 16px;
      text-align: center;
      color: var(--muted);
      font-size: .8rem;
    }

    @media (max-width: 620px) {
      .wrap { margin: 20px auto; }
      .details { grid-template-columns: 1fr; }
      .actions { grid-template-columns: 1fr; }
      .secondary { order: 2; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="header">
      <h1>TTBJ 総合力スコア計算</h1>
      <p>SPOT90・Grammar90・漢字SPOTの得点を入力してください。</p>
    </header>

    <section class="card" aria-labelledby="calculator-title">
      <div class="grid">
        <div class="field">
          <label for="spot">
            <span>SPOT90</span>
            <span>0〜90点</span>
          </label>
          <div class="input-wrap">
            <input id="spot" type="number" min="0" max="90" step="1"
                   inputmode="numeric" placeholder="例：47">
            <span class="suffix">/ 90</span>
          </div>
        </div>

        <div class="field">
          <label for="grammar">
            <span>Grammar90</span>
            <span>0〜90点</span>
          </label>
          <div class="input-wrap">
            <input id="grammar" type="number" min="0" max="90" step="1"
                   inputmode="numeric" placeholder="例：29">
            <span class="suffix">/ 90</span>
          </div>
        </div>

        <div class="field">
          <label for="kanji">
            <span>漢字SPOT</span>
            <span>0〜50点</span>
          </label>
          <div class="input-wrap">
            <input id="kanji" type="number" min="0" max="50" step="1"
                   inputmode="numeric" placeholder="例：10">
            <span class="suffix">/ 50</span>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="calcBtn" type="button">総合力スコアを計算</button>
        <button class="secondary" id="resetBtn" type="button">リセット</button>
      </div>

      <p class="error" id="errorMsg" role="alert"></p>

      <section class="result" id="result" aria-live="polite">
        <div class="score-main">
          <div class="caption">日本語力 総合スコア</div>
          <div class="value" id="overallScore">—</div>
          <div class="outof">/ 100</div>
        </div>

      </section>
    </section>

    <div class="footer">教員向け参考計算ツール</div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function validateNumber(value, min, max, label) {
      if (value === "") return `${label}を入力してください。`;
      const n = Number(value);
      if (!Number.isFinite(n) || !Number.isInteger(n)) {
        return `${label}は整数で入力してください。`;
      }
      if (n < min || n > max) {
        return `${label}は${min}〜${max}点の範囲で入力してください。`;
      }
      return "";
    }

    function calculate() {
      const spotValue = $("spot").value.trim();
      const grammarValue = $("grammar").value.trim();
      const kanjiValue = $("kanji").value.trim();

      const errors = [
        validateNumber(spotValue, 0, 90, "SPOT90"),
        validateNumber(grammarValue, 0, 90, "Grammar90"),
        validateNumber(kanjiValue, 0, 50, "漢字SPOT")
      ].filter(Boolean);

      if (errors.length) {
        $("errorMsg").textContent = errors[0];
        $("errorMsg").style.display = "block";
        $("result").style.display = "none";
        return;
      }

      const spot = Number(spotValue);
      const grammar = Number(grammarValue);
      const kanji = Number(kanjiValue);

      const jpRaw = spot + grammar;
      const overall = Math.round((jpRaw / 180) * 100);

      $("overallScore").textContent = overall;

      $("errorMsg").style.display = "none";
      $("result").style.display = "block";
      $("result").scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function resetForm() {
      ["spot", "grammar", "kanji"].forEach(id => $(id).value = "");
      $("errorMsg").style.display = "none";
      $("result").style.display = "none";
      $("spot").focus();
    }

    $("calcBtn").addEventListener("click", calculate);
    $("resetBtn").addEventListener("click", resetForm);

    ["spot", "grammar", "kanji"].forEach(id => {
      $(id).addEventListener("keydown", (e) => {
        if (e.key === "Enter") calculate();
      });
    });
  </script>
</body>
</html>
